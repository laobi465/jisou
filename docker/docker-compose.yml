services:
  # ===== 后端 API =====
  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    container_name: jisou-backend
    restart: unless-stopped
    env_file:
      - ../src/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - ../src/backend:/var/www/html
    networks:
      - jisou-net

  # ===== 前端构建（生产产物供 nginx 托管）=====
  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.Dockerfile
    container_name: jisou-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - jisou-net

  # ===== MySQL =====
  mysql:
    image: mysql:8.0
    container_name: jisou-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jisou}
      MYSQL_USER: ${MYSQL_USER:-jisou}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须设置 MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jisou-net

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: jisou-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jisou-net

  # ===== Meilisearch =====
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: jisou-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?必须设置 MEILISEARCH_KEY}
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    networks:
      - jisou-net

volumes:
  mysql-data:
  redis-data:
  meili-data:

networks:
  jisou-net:
    driver: bridge
